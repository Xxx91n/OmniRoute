name: Electron Windows Build

on:
  push:
    branches:
      - "release/v3.8.50"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Electron (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Next standalone bundle
        run: npm run build

      - name: Install Electron dependencies
        working-directory: electron
        # electron/package-lock.json on release/v3.8.50 is out of sync with
        # package.json (missing electron-builder's Windows optional deps such as
        # electron-builder-squirrel-windows / electron-winstaller /
        # @electron/windows-sign), so `npm ci` fails with EUSAGE.
        # `npm install` reconciles the lock in-memory; versions stay pinned
        # by the parent dependency specs.
        run: npm install --no-audit --no-fund

      - name: Patch electron-builder files config
        working-directory: electron
        # Upstream packaging bug: #9984 added electron/lib/loginHeaderCapture.js
        # and a require() of it in loginManager.js without adding it to the
        # electron-builder "files" allowlist, so packaged builds crash at
        # startup with "Cannot find module './lib/loginHeaderCapture'".
        # Pack the whole lib/ directory (all eight entries are runtime
        # modules). Idempotent: no-op once the branch carries a fixed
        # package.json.
        run: >-
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const cfg=p.build||p;if(!Array.isArray(cfg.files))throw new Error('electron-builder files array not found');if(!cfg.files.includes('lib/**')){cfg.files.push('lib/**');fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');}console.log('electron-builder files:',cfg.files.join(', '));"

      - name: Build Electron for Windows
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-windows
          path: |
            electron/dist-electron/*.exe
            electron/dist-electron/*.blockmap
            electron/dist-electron/latest*.yml
          if-no-files-found: error
          retention-days: 14
