name: Electron Windows Build

on:
  push:
    branches:
      - "release/v3.8.50"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Electron (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Next standalone bundle
        run: npm run build

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: Build Electron for Windows
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-windows
          path: |
            electron/dist-electron/*.exe
            electron/dist-electron/*.blockmap
            electron/dist-electron/latest*.yml
          if-no-files-found: error
          retention-days: 14
